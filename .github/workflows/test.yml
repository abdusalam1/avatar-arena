# GitHub Actions：跑单元测试（Windows，和实际运行环境一致）
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JS 单元测试（引擎 / 局 / 设置 / 渲染 / 文案）
        run: node --test "arena-*.test.mjs"

      - name: Python 测试（启动器 / 数据桥接入 / MIME）
        run: python test_launch_windows.py
